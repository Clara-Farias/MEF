// ---------- Mini line chart (no external chart library) ----------
function LineChartSVG({ data, color, darkMode }) {
  const w = 600, h = 220, padding = 30;
  const values = data.map((d) => d.geradas);
  const max = Math.max(...values) || 1;
  const stepX = (w - padding * 2) / (data.length - 1);
  const scaleY = (v) => h - padding - (v / max) * (h - padding * 2);
  const points = data.map((d, i) => `${padding + i * stepX},${scaleY(d.geradas)}`).join(" ");
  const gridColor = darkMode ? "#0B5050" : "#E2DBC6";
  const textColor = darkMode ? "#9BB5AB" : "#6B7B76";

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={padding} x2={w - padding} y1={padding + f * (h - padding * 2)} y2={padding + f * (h - padding * 2)} stroke={gridColor} strokeWidth="1" />
      ))}
      <polygon points={`${padding},${h - padding} ${points} ${w - padding},${h - padding}`} fill="url(#areaFill)" stroke="none" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {data.map((d, i) => (
        <circle key={i} cx={padding + i * stepX} cy={scaleY(d.geradas)} r="3" fill={color}>
          <title>{`${d.dia}: ${d.geradas}`}</title>
        </circle>
      ))}
      {data.map((d, i) => (
        i % 2 === 0 ? <text key={"t" + i} x={padding + i * stepX} y={h - 8} fontSize="10" fill={textColor} textAnchor="middle">{d.dia}</text> : null
      ))}
    </svg>
  );
}

const STATUS_DB_TO_LABEL = { pendente: "Pendente", aguardando_aprovacao: "Aguardando Aprovação", aprovada: "Aprovada", enviada: "Aprovada", erro: "Erro" };
const STATUS_LABEL_TO_DB = { Pendente: "pendente", "Aguardando Aprovação": "aguardando_aprovacao", Aprovada: "enviada", Erro: "erro" };
const TIPO_DB_TO_LABEL = { sucesso: "Sucesso", erro: "Erro", info: "Info" };

function formatarData(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
}
function formatarHora(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
}

// Cada linha de `assinaturas` já representa um colaborador (o Monday.com é a
// fonte de colaboradores — não existe tabela separada). As telas de
// Colaboradores e Assinaturas leem os mesmos registros, só mostram colunas
// diferentes.
function mapRegistroFromDb(row) {
  return {
    id: row.id,
    mondayId: row.monday_id,
    nome: row.nome,
    cargo: row.cargo,
    email: row.email,
    telefone: row.telefone || "",
    foto: row.foto,
    png_url: row.png_url,
    htmlAssinatura: row.html_assinatura,
    status: STATUS_DB_TO_LABEL[row.status] || row.status,
    atualizado: formatarData(row.ultima_atualizacao),
    data: formatarData(row.ultima_atualizacao),
    dataCriacaoRaw: row.data_criacao,
  };
}

function mapLogFromDb(row) {
  return {
    id: row.id,
    tipo: TIPO_DB_TO_LABEL[row.tipo] || row.tipo,
    descricao: row.descricao,
    usuario: row.usuario,
    data: `${formatarData(row.data)} ${formatarHora(row.data)}`,
    dataRaw: row.data,
  };
}

// Monta os últimos 14 dias (mesmo os sem nenhuma assinatura gerada) contando
// quantos registros de `assinaturas` foram criados em cada um.
function calcularEvolucaoDiaria(registros) {
  const dias = [];
  const hoje = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(hoje);
    d.setDate(d.getDate() - i);
    dias.push({ chave: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`, geradas: 0 });
  }
  registros.forEach((r) => {
    if (!r.dataCriacaoRaw) return;
    const d = new Date(r.dataCriacaoRaw);
    const chave = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
    const item = dias.find((x) => x.chave === chave);
    if (item) item.geradas++;
  });
  return dias.map((d) => ({ dia: d.chave, geradas: d.geradas }));
}

// Histórico é uma leitura mais amigável da própria tabela `logs`, agrupada por dia.
function historicoFromLogs(logs) {
  return logs.map((l) => ({
    id: l.id,
    data: formatarData(l.dataRaw),
    hora: formatarHora(l.dataRaw),
    evento: l.descricao,
    colaborador: l.usuario,
  }));
}

const LARGURA_FOTO = 170;
const ALTURA_FOTO = 170;

function formatarTelefone(tel) {
  if (!tel) return "";
  const d = String(tel).replace(/\D/g, "");
  const n = d.startsWith("55") && d.length >= 12 ? d.slice(2) : d;
  if (n.length === 11) return `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`;
  if (n.length === 10) return `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}`;
  return tel;
}

// Gera a assinatura como imagem PNG (792x250) direto no navegador — mesmo
// layout aprovado: fundo da marca + nome/cargo/telefone/e-mail.
async function gerarAssinaturaPNGBlob(colab) {
  const W = 792, H = 250;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.src = SIG_BG;
  await img.decode();
  ctx.drawImage(img, 0, 0, W, H);
  try {
    await Promise.all([document.fonts.load("700 24px Poppins"), document.fonts.load("400 15px Poppins")]);
  } catch (e) { /* segue com a fonte reserva */ }
  const fam = "Poppins, 'Segoe UI', Arial, sans-serif";
  const tel = formatarTelefone(colab.telefone);
  ctx.fillStyle = SIG_TEXT;
  ctx.textBaseline = "alphabetic";
  ctx.font = `700 24px ${fam}`; ctx.fillText(colab.nome || "", 40, 44);
  ctx.font = `400 15px ${fam}`; ctx.fillText(colab.cargo || "", 40, 66);
  if (tel) {
    ctx.font = `700 23px ${fam}`; ctx.fillText(tel, 40, 115);
    ctx.font = `400 15px ${fam}`; ctx.fillText(colab.email || "", 40, 137);
  } else {
    ctx.font = `700 23px ${fam}`; ctx.fillText(colab.email || "", 40, 115);
  }
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("falha ao gerar PNG"))), "image/png"));
}

async function baixarAssinaturaPNG(colab) {
  const blob = await gerarAssinaturaPNGBlob(colab);
  const slug = String(colab.nome || "assinatura").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `assinatura-${slug}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function generateSignatureHTML(colab) {
  const telFmt = formatarTelefone(colab.telefone);
  const temFoto = Boolean(colab.foto);
  const left = temFoto ? 40 + LARGURA_FOTO + 20 : 40;
  const fotoHtml = temFoto
    ? `<img src="${colab.foto}" width="${LARGURA_FOTO}" height="${ALTURA_FOTO}" style="position:absolute;left:0;top:0;width:${LARGURA_FOTO}px;height:${ALTURA_FOTO}px;object-fit:cover;" />`
    : "";
  const emailHtml = `<a href="mailto:${colab.email}" style="color:${SIG_TEXT};text-decoration:none;">${colab.email}</a>`;
  const telefoneHtml = telFmt
    ? `<a href="tel:${telFmt}" style="color:${SIG_TEXT};text-decoration:none;">${telFmt}</a>`
    : "";
  const segundoBloco = telFmt
    ? `<div style="font-size:23px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${telefoneHtml}</div>
    <div style="font-size:15px;font-weight:400;color:${SIG_TEXT};margin-top:3px;">${emailHtml}</div>`
    : `<div style="font-size:23px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${emailHtml}</div>`;
  return `<div style="width:792px;max-width:792px;height:250px;position:relative;overflow:hidden;background-image:url('${SIG_BG}');background-size:792px 250px;background-repeat:no-repeat;font-family:'Poppins','Segoe UI',Arial,sans-serif;">
  ${fotoHtml}
  <div style="position:absolute;left:${left}px;top:26px;">
    <div style="font-size:24px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${colab.nome}</div>
    <div style="font-size:15px;font-weight:400;color:${SIG_TEXT};margin-top:3px;">${colab.cargo}</div>
  </div>

  <div style="position:absolute;left:${left}px;top:96px;">
    ${segundoBloco}
  </div>
</div>`;
}

function downloadHTML(colab) {
  const inner = generateSignatureHTML(colab);
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8" /><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap');</style></head><body style="margin:0;padding:24px;background:#ffffff;">${inner}</body></html>`;
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `assinatura-${colab.nome.toLowerCase().replace(/\s+/g, "-")}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function useTheme(darkMode) {
  return {
    bg: darkMode ? "bg-[#022626]" : "bg-[#EFEADD]",
    panel: darkMode ? "bg-[#033838]" : "bg-white",
    border: darkMode ? "border-[#0B5050]" : "border-[#E2DBC6]",
    text: darkMode ? "text-[#EFEADD]" : "text-[#033838]",
    subtext: darkMode ? "text-[#9BB5AB]" : "text-[#66736F]",
    hover: darkMode ? "hover:bg-[#0A4545]" : "hover:bg-[#F6F2E6]",
    input: darkMode ? "bg-[#022626] border-[#0B5050] text-[#EFEADD] placeholder-[#6F8F84]" : "bg-white border-[#D9D2BC] text-[#033838] placeholder-[#9AA39F]",
  };
}

const STATUS_STYLES = {
  Pendente: { bg: "bg-gray-100", text: "text-gray-600", dot: "#9CA3AF" },
  "Aguardando Aprovação": { bg: "bg-amber-50", text: "text-amber-700", dot: "#F59E0B" },
  Aprovada: { bg: "bg-emerald-50", text: "text-emerald-700", dot: "#1a934d" },
  Erro: { bg: "bg-red-50", text: "text-red-700", dot: "#EF4444" },
  Ativo: { bg: "bg-emerald-50", text: "text-emerald-700", dot: "#1a934d" },
  "Sem Assinatura": { bg: "bg-gray-100", text: "text-gray-500", dot: "#9CA3AF" },
};

function StatusBadge({ status, darkMode }) {
  const s = STATUS_STYLES[status] || STATUS_STYLES.Pendente;
  const lightCls = `${s.bg} ${s.text}`;
  const cls = darkMode ? "bg-[#0A4545] text-[#EFEADD]" : lightCls;
  return (
    <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${cls}`}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: s.dot }} />
      {status}
    </span>
  );
}

function ToastView({ toast }) {
  if (!toast) return null;
  const isError = toast.type === "error";
  return (
    <div className="fixed top-5 right-5 z-[100]">
      <div className={`flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border ${isError ? "bg-red-50 border-red-200 text-red-700" : "bg-white border-gray-200 text-gray-800"}`}>
        <Icon name={isError ? "x-circle" : "check-circle-2"} size={18} style={{ color: isError ? "#EF4444" : BRAND_GREEN }} />
        <span className="text-sm font-medium">{toast.msg}</span>
      </div>
    </div>
  );
}

function Sidebar({ page, setPage, sidebarOpen, setSidebarOpen, revisaoCount }) {
  return (
    <>
      {sidebarOpen && <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setSidebarOpen(false)} />}
      <aside
        className={`fixed md:static inset-y-0 left-0 z-40 w-64 flex flex-col transition-transform duration-200 ${sidebarOpen ? "translate-x-0" : "-translate-x-full"} md:translate-x-0`}
        style={{ background: BRAND_DARK }}
      >
        <div className="px-5 pt-6 pb-5" style={{ borderBottom: "1px solid rgba(239,234,221,0.12)" }}>
          <img src={LOGO_BRANCO} alt="Meireles & Freitas — Gestão em Cobranças" className="w-full" style={{ maxWidth: 196 }} />
          <div className="titulo-marca mt-4" style={{ color: BRAND_LIME, fontSize: 10 }}>Gerador de assinaturas</div>
        </div>
        <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          {NAV_ITEMS.map((item) => {
            const active = page === item.key;
            return (
              <button
                key={item.key}
                onClick={() => { setPage(item.key); setSidebarOpen(false); }}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-colors ${active ? "" : "hover:bg-white/10"}`}
                style={active ? { background: BRAND_LIME, color: BRAND_DARK, fontWeight: 700 } : { color: "rgba(239,234,221,0.88)", fontWeight: 500 }}
              >
                <Icon name={item.icon} size={18} />
                <span className="flex-1 text-left">{item.label}</span>
                {item.key === "revisao" && revisaoCount > 0 && (
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ background: active ? BRAND_DARK : BRAND_LIME, color: active ? BRAND_LIME : BRAND_DARK }}>
                    {revisaoCount}
                  </span>
                )}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-4 text-[11px] leading-snug" style={{ color: "rgba(239,234,221,0.55)", borderTop: "1px solid rgba(239,234,221,0.12)" }}>
          Meireles &amp; Freitas<br />Gestão em Cobranças
        </div>
      </aside>
    </>

function ColaboradoresPage({ t, darkMode, colaboradores, search, setSearch, onGerar, generatingId, onView, onEdit }) {
  const [pageIdx, setPageIdx] = useState(0);
  const pageSize = 5;

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return colaboradores;
    return colaboradores.filter((c) => c.nome.toLowerCase().includes(q) || c.cargo.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
  }, [colaboradores, search]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageItems = filtered.slice(pageIdx * pageSize, pageIdx * pageSize + pageSize);

  useEffect(() => { setPageIdx(0); }, [search]);

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className={`flex items-center gap-2 px-3 py-2 rounded-lg border max-w-md ${t.input}`}>
        <Icon name="search" size={16} className={t.subtext} />
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Buscar por nome, cargo ou e-mail..."
          className="flex-1 bg-transparent outline-none text-sm"
        />
      </div>

      <div className={`rounded-xl border overflow-hidden ${t.panel} ${t.border}`}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className={t.subtext}>
                <th className="text-left font-medium px-5 py-3">Nome</th>
                <th className="text-left font-medium px-5 py-3 hidden lg:table-cell">E-mail</th>
                <th className="text-left font-medium px-5 py-3 hidden md:table-cell">Telefone</th>
                <th className="text-left font-medium px-5 py-3">Status</th>
                <th className="text-left font-medium px-5 py-3 hidden lg:table-cell">Atualizado</th>
                <th className="text-right font-medium px-5 py-3">Ações</th>
              </tr>
            </thead>
            <tbody>

                <tr key={c.id} className={`border-t ${t.border} ${t.hover}`}>
                  <td className="px-5 py-3">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold shrink-0" style={{ background: AVATAR_COLORS[c.id % AVATAR_COLORS.length] }}>
                        {initials(c.nome)}
                      </div>
                      <div className="min-w-0">
                        <div className={`font-medium truncate ${t.text}`}>{c.nome}</div>
                        <div className={`text-xs truncate ${t.subtext}`}>{c.cargo}</div>
                      </div>
                    </div>
                  </td>
                  <td className={`px-5 py-3 ${t.subtext} hidden lg:table-cell`}>{c.email}</td>
                  <td className={`px-5 py-3 ${t.subtext} hidden md:table-cell`}>{c.telefone}</td>
                  <td className="px-5 py-3"><StatusBadge status={c.status} darkMode={darkMode} /></td>
                  <td className={`px-5 py-3 ${t.subtext} hidden lg:table-cell`}>{c.atualizado}</td>
                  <td className="px-5 py-3">
                    <div className="flex items-center justify-end gap-1">
                      <button title="Visualizar" onClick={() => onView(c)} className={`p-1.5 rounded-lg ${t.hover}`}>
                        <Icon name="eye" size={15} className={t.subtext} />
                      </button>
                      <button title="Gerar assinatura" onClick={() => onGerar(c)} disabled={generatingId === c.id} className={`p-1.5 rounded-lg ${t.hover} disabled:opacity-50`}>
                        <Icon name={generatingId === c.id ? "loader-2" : "file-signature"} size={15} className={generatingId === c.id ? "animate-spin" : ""} style={{ color: BRAND_GREEN }} />
                      </button>
                      <button title="Editar" onClick={() => onEdit(c)} className={`p-1.5 rounded-lg ${t.hover}`}>
                        <Icon name="pencil" size={15} className={t.subtext} />

        <div className={`flex items-center justify-between px-5 py-3 border-t ${t.border}`}>

            <button disabled={pageIdx === 0} onClick={() => setPageIdx((p) => p - 1)} className={`p-1.5 rounded-lg ${t.hover} disabled:opacity-30`}>
              <Icon name="chevron-left" size={16} className={t.text} />

function PreviewModal({ colaborador, assinatura, onClose, onRegenerar, onEnviarRevisao, onGerar, onBaixar, loading, t }) {
  const [copied, setCopied] = useState(false);
  if (!colaborador) return null;

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(generateSignatureHTML(colaborador));
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      setCopied(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
      <div className={`w-full max-w-2xl rounded-2xl border shadow-2xl ${t.panel} ${t.border} max-h-[90vh] flex flex-col`}>
        <div className={`flex items-center justify-between px-5 py-4 border-b ${t.border} shrink-0`}>
          <div>
            <h3 className={`text-sm font-semibold ${t.text}`}>Preview da assinatura</h3>
            <p className={`text-xs ${t.subtext}`}>{colaborador.nome}</p>
          </div>
          <button onClick={onClose} className={`p-1.5 rounded-lg ${t.hover}`}>
            <Icon name="x" size={18} className={t.text} />
          </button>
        </div>

        <div className="p-5 overflow-y-auto space-y-4">
          {!assinatura ? (
            <div className={`text-center py-10 ${t.subtext}`}>
              <Icon name="file-signature" size={28} className="mx-auto mb-3 opacity-50" />
              <p className="text-sm mb-4">Nenhuma assinatura gerada ainda para este colaborador.</p>
              <button onClick={() => onGerar(colaborador)} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: BRAND_GREEN }}>
                Gerar agora
              </button>
            </div>
          ) : (
            <>
              <div className="rounded-xl border border-[#E2DBC6] overflow-hidden">
                <div className="bg-white p-5">
                  {loading ? (
                    <div className="flex items-center gap-2 text-gray-400 text-sm py-6">
                      <Icon name="loader-2" size={16} className="animate-spin" /> Gerando assinatura...
                    </div>
                  ) : (
                    <div style={{ width: 792 * SIG_SCALE, height: 250 * SIG_SCALE, overflow: "hidden" }}>
                      <div
                        style={{ width: 792, height: 250, transform: `scale(${SIG_SCALE})`, transformOrigin: "top left" }}
                        dangerouslySetInnerHTML={{ __html: generateSignatureHTML(colaborador) }}
                      />
                    </div>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => onRegenerar(colaborador)} className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name="refresh-cw" size={14} /> Regenerar
                </button>
                <button onClick={() => onBaixar(colaborador)} className="col-span-2 flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: BRAND_GREEN }}>
                  <Icon name="download" size={14} /> Baixar assinatura (PNG)
                </button>
                <button onClick={() => downloadHTML(colaborador)} className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name="download" size={14} /> Baixar HTML
                </button>
                <button onClick={handleCopy} className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name={copied ? "check" : "copy"} size={14} style={copied ? { color: BRAND_GREEN } : {}} /> {copied ? "Copiado!" : "Copiar HTML"}
                </button>
                <button onClick={() => onEnviarRevisao(assinatura)} className="flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-white" style={{ background: BRAND_GREEN }}>
                  <Icon name="send" size={14} /> Enviar p/ Revisão
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function HistoricoPage({ t, historico }) {
  const grouped = useMemo(() => {
    const map = {};
    historico.forEach((h) => {
      if (!map[h.data]) map[h.data] = [];
      map[h.data].push(h);
    });
    return Object.entries(map);
  }, [historico]);

  return (
    <div className="p-4 md:p-6 max-w-2xl">
      <div className="space-y-8">
        {grouped.map(([data, eventos]) => (
          <div key={data}>
            <div className={`text-sm font-semibold mb-3 ${t.text}`}>{data}</div>
            <div className="space-y-4 pl-1">
              {eventos.map((ev) => (
                <div key={ev.id} className="flex gap-3">
                  <div className="w-2 h-2 rounded-full shrink-0 mt-1.5" style={{ background: BRAND_GREEN }} />
                  <div className="pb-1">
                    <div className={`text-sm font-medium ${t.text}`}>{ev.evento}</div>
                    <div className={`text-xs ${t.subtext}`}>{ev.hora} · {ev.colaborador}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const LOG_STYLES = {
  Sucesso: { icon: "check-circle-2", color: BRAND_GREEN },
  Erro: { icon: "x-circle", color: "#EF4444" },
  Info: { icon: "alert-circle", color: "#3B82F6" },
};

function LogsPage({ t, logs }) {
  const [filter, setFilter] = useState("Todos");
  const filtered = filter === "Todos" ? logs : logs.filter((l) => l.tipo === filter);

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className="flex flex-wrap gap-2">
        {["Todos", "Sucesso", "Erro", "Info"].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-medium border ${filter === f ? "text-white border-transparent" : `${t.text} ${t.border} ${t.hover}`}`}
            style={filter === f ? { background: BRAND_GREEN } : {}}
          >
            {f}
          </button>
        ))}
      </div>
      <div className={`rounded-xl border ${t.panel} ${t.border} overflow-hidden`}>
        {filtered.map((l, idx) => {
          const s = LOG_STYLES[l.tipo] || LOG_STYLES.Info;
          return (
            <div key={l.id} className={`flex items-start gap-3 px-5 py-3.5 ${idx !== filtered.length - 1 ? `border-b ${t.border}` : ""}`}>
              <Icon name={s.icon} size={16} style={{ color: s.color }} className="mt-0.5 shrink-0" />
              <div className="flex-1 min-w-0">
                <p className={`text-sm ${t.text}`}>{l.descricao}</p>
                <p className={`text-xs ${t.subtext}`}>{l.usuario} · {l.data}</p>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div className={`px-5 py-10 text-center text-sm ${t.subtext}`}>Nenhum log neste filtro.</div>}
      </div>
    </div>
  );
}

function EditColaboradorModal({ colaborador, onClose, onSave, t }) {
  const [nome, setNome] = useState(colaborador ? colaborador.nome : "");
  const [cargo, setCargo] = useState(colaborador ? colaborador.cargo : "");
  const [telefone, setTelefone] = useState(colaborador ? colaborador.telefone : "");

  if (!colaborador) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
      <div className={`w-full max-w-md rounded-2xl border shadow-2xl ${t.panel} ${t.border}`}>
        <div className={`flex items-center justify-between px-5 py-4 border-b ${t.border}`}>
          <h3 className={`text-sm font-semibold ${t.text}`}>Editar colaborador</h3>
          <button onClick={onClose} className={`p-1.5 rounded-lg ${t.hover}`}><Icon name="x" size={18} className={t.text} /></button>
        </div>
        <div className="p-5 space-y-4">
          <div>
            <label className={`block text-sm font-medium mb-2 ${t.text}`}>Nome</label>
            <input value={nome} onChange={(e) => setNome(e.target.value)} className={`w-full px-3 py-2 rounded-lg border text-sm ${t.input}`} />
          </div>
          <div>
            <label className={`block text-sm font-medium mb-2 ${t.text}`}>Cargo</label>
            <input value={cargo} onChange={(e) => setCargo(e.target.value)} className={`w-full px-3 py-2 rounded-lg border text-sm ${t.input}`} />
          </div>
          <div>
            <label className={`block text-sm font-medium mb-2 ${t.text}`}>Telefone</label>
            <input value={telefone} onChange={(e) => setTelefone(e.target.value)} className={`w-full px-3 py-2 rounded-lg border text-sm ${t.input}`} />
          </div>
          <div>
            <label className={`block text-sm font-medium mb-2 ${t.text}`}>E-mail</label>
            <input value={colaborador.email} disabled className={`w-full px-3 py-2 rounded-lg border text-sm opacity-60 ${t.input}`} />
            <p className={`text-xs mt-1 ${t.subtext}`}>Sincronizado do Monday.com</p>
          </div>
        </div>
        <div className={`flex justify-end gap-2 px-5 py-4 border-t ${t.border}`}>
          <button onClick={onClose} className={`px-4 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>Cancelar</button>
          <button onClick={() => onSave({ ...colaborador, nome, cargo, telefone })} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: BRAND_GREEN }}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [darkMode, setDarkMode] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const [registros, setRegistros] = useState([]);
  const [logs, setLogs] = useState([]);
  const [carregandoDados, setCarregandoDados] = useState(true);
  const [search, setSearch] = useState("");

  const [generatingId, setGeneratingId] = useState(null);
  const [previewColab, setPreviewColab] = useState(null);
  const [previewLoading, setPreviewLoading] = useState(false);
  const [editColab, setEditColab] = useState(null);

  const t = useTheme(darkMode);

  const carregarDados = async () => {
    setCarregandoDados(true);
    const [{ data: assinaturasData, error: e1 }, { data: logsData, error: e2 }] = await Promise.all([
      sb.from("assinaturas").select("*").order("ultima_atualizacao", { ascending: false }),
      sb.from("logs").select("*").order("data", { ascending: false }).limit(50),
    ]);
    if (e1) console.error("Erro ao buscar assinaturas:", e1.message);
    if (e2) console.error("Erro ao buscar logs:", e2.message);
    setRegistros((assinaturasData || []).map(mapRegistroFromDb));
    setLogs((logsData || []).map(mapLogFromDb));
    setCarregandoDados(false);
  };

  useEffect(() => {
    carregarDados();
  }, []);

  useEffect(() => {
    if (!toast) return;
    const timer = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(timer);
  }, [toast]);

  const notify = (msg, type) => setToast({ msg, type: type || "success" });

  const registrarLog = async (descricao, tipo) => {
    await sb.from("logs").insert({ tipo: tipo || "sucesso", descricao, usuario: "Equipe de Produtos" });
  };

  const handleGerar = async (registro) => {
    setGeneratingId(registro.id);
    const html = generateSignatureHTML(registro);
    const { error } = await sb.from("assinaturas").update({ html_assinatura: html, status: "pendente" }).eq("id", registro.id);
    setGeneratingId(null);
    if (error) {
      notify(`Erro ao gerar assinatura de ${registro.nome}`, "error");
      await registrarLog(`Falha ao gerar assinatura de ${registro.nome}: ${error.message}`, "erro");
    } else {
      notify(`Assinatura gerada para ${registro.nome}`);
      await registrarLog(`Assinatura gerada para ${registro.nome}`);
    }
    carregarDados();
  };

  const handleRegenerar = async (registro) => {
    setPreviewLoading(true);
    const html = generateSignatureHTML(registro);
    const { error } = await sb.from("assinaturas").update({ html_assinatura: html }).eq("id", registro.id);
    setPreviewLoading(false);
    if (error) {
      notify(`Erro ao regenerar assinatura de ${registro.nome}`, "error");
    } else {
      notify(`Assinatura de ${registro.nome} regenerada`);
      await registrarLog(`Assinatura regenerada para ${registro.nome}`);
    }
    carregarDados();
  };

  const handleEnviarRevisao = async (registro) => {
    const { error } = await sb.from("assinaturas").update({ status: "aguardando_aprovacao" }).eq("id", registro.id);
    if (!error) {
      notify(`Assinatura de ${registro.nome} enviada para revisão`);
      await registrarLog(`Assinatura de ${registro.nome} enviada para revisão`);
    }
    setPreviewColab(null);
    carregarDados();
  };

  const handleAdvance = async (registro) => {
    const atual = STATUS_LABEL_TO_DB[registro.status];
    let novo = atual;
    let msg = "";
    if (atual === "pendente") { novo = "aguardando_aprovacao"; msg = "enviada para revisão"; }
    else if (atual === "aguardando_aprovacao") { novo = "enviada"; msg = "aprovada — pronta para baixar"; }
    else if (atual === "erro") { novo = "pendente"; msg = "reenfileirada"; }
    const { error } = await sb.from("assinaturas").update({ status: novo }).eq("id", registro.id);
    if (!error) {
      notify(`Assinatura de ${registro.nome} ${msg}`);
      await registrarLog(`Assinatura de ${registro.nome} ${msg}`);
    }
    carregarDados();
  };

  const handleReprovar = async (registro) => {
    const { error } = await sb.from("assinaturas").update({ status: "pendente" }).eq("id", registro.id);
    if (!error) {
      notify(`Assinatura de ${registro.nome} reprovada — devolvida para nova geração`);
      await registrarLog(`Assinatura de ${registro.nome} reprovada, devolvida para nova geração`, "erro");
    }
    carregarDados();
  };

  const handleBaixar = async (registro) => {
    try {
      await baixarAssinaturaPNG(registro);
      notify(`Assinatura de ${registro.nome} baixada`);
    } catch (e) {
      notify("Não foi possível gerar o PNG", "error");
    }
  };

  const handleSaveEdit = async (updated) => {
    const { error } = await sb.from("assinaturas").update({ nome: updated.nome, cargo: updated.cargo, telefone: updated.telefone }).eq("id", updated.id);
    if (!error) notify(`Dados de ${updated.nome} atualizados`);
    setEditColab(null);
    carregarDados();
  };

  const previewAssinatura = previewColab && previewColab.htmlAssinatura ? previewColab : null;
  const evolucaoDiaria = calcularEvolucaoDiaria(registros);
  const historico = historicoFromLogs(logs);
  const [title, subtitle] = PAGE_TITLES[page];

  return (
    <div className={`min-h-screen flex ${t.bg}`}>
      <ToastView toast={toast} />
      <Sidebar page={page} setPage={setPage} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} revisaoCount={registros.filter((r) => r.status === "Aguardando Aprovação").length} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar title={title} subtitle={subtitle} t={t} darkMode={darkMode} setDarkMode={setDarkMode} setSidebarOpen={setSidebarOpen} />
        <main className="flex-1 overflow-y-auto">
          {carregandoDados ? (
            <div className={`flex items-center justify-center gap-2 py-20 ${t.subtext}`}>
              <Icon name="loader-2" size={18} className="animate-spin" /> Carregando assinaturas...
            </div>
          ) : (
            <>
              {page === "dashboard" && <DashboardPage t={t} darkMode={darkMode} assinaturas={registros} evolucaoDiaria={evolucaoDiaria} />}
              {page === "colaboradores" && (
                <ColaboradoresPage t={t} darkMode={darkMode} colaboradores={registros} search={search} setSearch={setSearch} onGerar={handleGerar} generatingId={generatingId} onView={setPreviewColab} onEdit={setEditColab} />
              )}
              {page === "assinaturas" && (
                <AssinaturasPage t={t} darkMode={darkMode} assinaturas={registros} onView={setPreviewColab} onAdvance={handleAdvance} onBaixar={handleBaixar} />
              )}
              {page === "revisao" && (
                <RevisaoPage t={t} darkMode={darkMode} assinaturas={registros} onView={setPreviewColab} onAdvance={handleAdvance} onReprovar={handleReprovar} onBaixar={handleBaixar} />
              )}
              {page === "templates" && <TemplatesPage t={t} onSave={notify} />}
              {page === "historico" && <HistoricoPage t={t} historico={historico} />}
              {page === "logs" && <LogsPage t={t} logs={logs} />}
            </>
          )}
        </main>
      </div>

      {previewColab && (
        <PreviewModal
          colaborador={previewColab}
          assinatura={previewAssinatura}
          onClose={() => setPreviewColab(null)}
          onRegenerar={handleRegenerar}
          onEnviarRevisao={handleEnviarRevisao}
          onGerar={handleGerar}
          onBaixar={handleBaixar}
          loading={previewLoading}
          t={t}
        />
      )}

      {editColab && <EditColaboradorModal colaborador={editColab} onClose={() => setEditColab(null)} onSave={handleSaveEdit} t={t} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  (function () {
    var root = document.getElementById("root");
    if (typeof Babel === "undefined" || typeof React === "undefined" || typeof ReactDOM === "undefined") {
      root.innerHTML = '<div style="font-family:sans-serif;max-width:520px;margin:60px auto;padding:24px;border:1px solid #FCA5A5;background:#FEF2F2;border-radius:12px;color:#991B1B;">' +
        '<h2 style="margin-top:0;">Não foi possível carregar o app</h2>' +
        '<p>Um recurso externo necessário (React, Babel ou similar) não carregou — provavelmente algo na rede está bloqueando o CDN. Tente abrir numa rede diferente (ex: dados móveis) ou avise o time de TI que os domínios <code>cdn.jsdelivr.net</code> e <code>cdn.tailwindcss.com</code> precisam estar liberados.</p>' +
        '</div>';
      return;
    }
    try {
      var src = document.getElementById("app-source").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    } catch (e) {
      root.innerHTML = '<div style="font-family:sans-serif;max-width:520px;margin:60px auto;padding:24px;border:1px solid #FCA5A5;background:#FEF2F2;border-radius:12px;color:#991B1B;">' +
        '<h2 style="margin-top:0;">Erro ao iniciar o app</h2><p>' + String(e.message || e) + '</p></div>';
    }
  })();
</script>
